name: UI Shell Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        run: ./gradlew --no-configuration-cache assembleStandardPreview

      - name: Upload unsigned APK to Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ui-shell-neoplayer-iso-v1.4.6-playlist-resume-key
        run: |
          set -e
          APK=app/build/outputs/apk/standard/preview/app-standard-arm64-v8a-preview-unsigned.apk
          test -f "$APK"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "XNPlayer v1.4.6 playlist resume key unsigned" --notes "XNPlayer v1.4.6: fix playlist/next-episode resume key mismatch. loadPlaylistItemInternal computed mediaIdentifier from the temporary local proxy URI (fileName_<proxy URL hash>) before syncing network extras, while reopening from the folder used the stable network_&lt;connectionId&gt;_&lt;pathHash&gt; key. Now network extras are written to the intent first and getMediaIdentifier(intent, fileName) is used for every playlist item, so saved positions written on autoplay are found again on reopen. Keeps v1.4.5 black-screen fix, v1.4.4 dynamic mpv.conf start/end, v1.4.1 autoscroll/recent playlist and v1.4.0 HW+ configure retry."
          gh release upload "$TAG" "$APK" --clobber
