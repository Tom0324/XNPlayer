name: UI Shell Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        run: ./gradlew --no-configuration-cache assembleStandardPreview

      - name: Upload unsigned APK to Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ui-shell-neoplayer-iso-v1.3.0
        run: |
          set -e
          APK=app/build/outputs/apk/standard/preview/app-standard-arm64-v8a-preview-unsigned.apk
          test -f "$APK"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "XNPlayer v1.3.0 NeoPlayer ISO unsigned" --notes "XNPlayer v1.3.0: mpvEx UI + WebDAV lazy block cache + NextPlayerCloud/FongMi ISO kernel (stream_iso/dvdnav/libbluray) + AVC PTS patch; FFmpeg release-8.1-fongmi; libplacebo fongmi; no forced software decoding"
          gh release upload "$TAG" "$APK" --clobber
