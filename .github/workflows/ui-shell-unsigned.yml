name: UI Shell Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        run: ./gradlew --no-configuration-cache assembleStandardPreview

      - name: Upload unsigned APK to Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ui-shell-neoplayer-iso-v1.4.5-smartstart-fix
        run: |
          set -e
          APK=app/build/outputs/apk/standard/preview/app-standard-arm64-v8a-preview-unsigned.apk
          test -f "$APK"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "XNPlayer v1.4.5 smart start black screen fix unsigned" --notes "XNPlayer v1.4.5: fix v1.4.4 black screen regression. BaseMPVView.playFile() only caches filePath; loadfile is issued by surfaceCreated(). v1.4.4 put playFile behind a suspend DB query, so surfaceCreated fired first and no loadfile was ever sent. Now applyStartOverrideForSavedPosition and playFile run synchronously on the main thread in onCreate, before the surface callback, while the DB lookup uses runBlocking(Dispatchers.IO). Keeps the v1.4.4 dynamic mpv.conf start/end behavior and all previous fixes."
          gh release upload "$TAG" "$APK" --clobber
