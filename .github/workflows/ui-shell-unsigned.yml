name: UI Shell Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Use EOF frame reset AAR
        run: |
          set -e
          curl -fL --retry 3 -o app/libs/mpv-android-avcfix.aar \
            https://github.com/Tom0324/mpv-android-fongmi/releases/download/native-avcfix-mpv042-iso-eof-frame-reset-20261129/app-release.aar
          echo "2c03963f8e3297ab596602957077b586f77c5cac285ae84efb00befd1ca9bec4  app/libs/mpv-android-avcfix.aar" | sha256sum -c -
          test -s app/libs/mpv-android-avcfix.aar

      - name: Build preview APKs
        run: ./gradlew --no-configuration-cache assembleStandardPreview

      - name: Upload unsigned APK to Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ui-shell-neoplayer-iso-v1.4.8-eof-frame-reset
        run: |
          set -e
          APK=app/build/outputs/apk/standard/preview/app-standard-arm64-v8a-preview-unsigned.apk
          test -f "$APK"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "XNPlayer v1.4.8 EOF frame reset unsigned" --notes "XNPlayer v1.4.8: keep the v1.4.7 15-line uninit fix and add the EOF frame reset adapted from mpv PR #14631. On file transition the VO forgets current frame references so FFmpeg can stop the previous MediaCodec instead of leaving it connected to the AImageReader surface. Keeps HW+ default mediacodec,mediacodec-copy,no and all NeoPlayer features (Vulkan, DV mapping, HDR colorspace, stale-frame check, retained frames, async images, max_images=5, stats). Also keeps v1.4.6 stable playlist resume key, v1.4.5 black-screen fix, v1.4.4 dynamic mpv.conf start/end, v1.4.1 autoscroll/recent-playlist fixes and v1.4.0 configure retry."
          gh release upload "$TAG" "$APK" --clobber
