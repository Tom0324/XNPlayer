name: UI Shell Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Use synchronous EOF frame reset AAR
        run: |
          set -e
          curl -fL --retry 3 -o app/libs/mpv-android-avcfix.aar \
            https://github.com/Tom0324/mpv-android-fongmi/releases/download/native-avcfix-mpv042-iso-eof-frame-reset-sync-20261129/app-release.aar
          echo "97174e10559b00cae26480947a5a9b2d5130dc33ad53a5f44e5d263f7c79e51e  app/libs/mpv-android-avcfix.aar" | sha256sum -c -
          test -s app/libs/mpv-android-avcfix.aar

      - name: Build preview APKs
        run: ./gradlew --no-configuration-cache assembleStandardPreview

      - name: Upload unsigned APK to Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ui-shell-neoplayer-iso-v1.5.0-eof-frame-reset-sync
        run: |
          set -e
          APK=app/build/outputs/apk/standard/preview/app-standard-arm64-v8a-preview-unsigned.apk
          test -f "$APK"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "XNPlayer v1.5.0 synchronous EOF frame reset unsigned" --notes "XNPlayer v1.5.0: make EOF frame reset synchronous (vo_wakeup + vo_control VOCTRL_RESET/FRAME_RESET, no async duplicate) so VO frame refs are released before decoder teardown; extend mediacodec configure retry to 20 x 100ms and add FFmpeg close diagnostics showing hw_buffer_count and stop decision. Keeps HW+ default mediacodec,mediacodec-copy,no and all NeoPlayer features (Vulkan, DV mapping, HDR colorspace, stale-frame check, retained frames, async images, max_images=5, stats). Also keeps v1.4.6 stable playlist resume key, v1.4.5 black-screen fix, v1.4.4 dynamic mpv.conf start/end, v1.4.1 autoscroll/recent-playlist fixes and v1.4.0 configure retry."
          gh release upload "$TAG" "$APK" --clobber
