name: UI Shell Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ui-shell

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        run: ./gradlew assembleStandardPreview

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: ui-shell-unsigned-apks
          path: app/build/outputs/apk/standard/preview/*-unsigned.apk
          if-no-files-found: error
