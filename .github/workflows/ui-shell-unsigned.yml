name: UI Shell Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Use corrected EOF frame reset AAR
        run: |
          set -e
          curl -fL --retry 3 -o app/libs/mpv-android-avcfix.aar \
            https://github.com/Tom0324/mpv-android-fongmi/releases/download/native-avcfix-mpv042-iso-eof-frame-reset-fix-20261129/app-release.aar
          echo "936d15e11798b9c5191f2ddc90b4b9588c46710ba058e74b5347c8b1c3b98d18  app/libs/mpv-android-avcfix.aar" | sha256sum -c -
          test -s app/libs/mpv-android-avcfix.aar

      - name: Build preview APKs
        run: ./gradlew --no-configuration-cache assembleStandardPreview

      - name: Upload unsigned APK to Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ui-shell-neoplayer-iso-v1.4.9-eof-frame-reset-fix
        run: |
          set -e
          APK=app/build/outputs/apk/standard/preview/app-standard-arm64-v8a-preview-unsigned.apk
          test -f "$APK"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "XNPlayer v1.4.9 EOF frame reset fix unsigned" --notes "XNPlayer v1.4.9: fix the v1.4.8 EOF frame reset call order. vo_eof_reset() is now called before uninit_video_chain() clears vo_chain, so VO frame references are actually released on file transition and FFmpeg can stop the previous MediaCodec before the next configure. Keeps HW+ default mediacodec,mediacodec-copy,no and all NeoPlayer features (Vulkan, DV mapping, HDR colorspace, stale-frame check, retained frames, async images, max_images=5, stats). Also keeps v1.4.6 stable playlist resume key, v1.4.5 black-screen fix, v1.4.4 dynamic mpv.conf start/end, v1.4.1 autoscroll/recent-playlist fixes and v1.4.0 configure retry."
          gh release upload "$TAG" "$APK" --clobber
