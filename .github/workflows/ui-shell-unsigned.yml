name: UI Shell Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ui-shell

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Download AListLib arm64 AAR
        run: |
          mkdir -p app/libs
          curl -L --fail --retry 3 \
            -o app/libs/alistlib-arm64-slim.aar \
            https://github.com/Tom0324/AListLiteAndroid/releases/download/alistlib-arm64-v4.2.6/alistlib-arm64-slim.aar
          ls -lh app/libs/alistlib-arm64-slim.aar
      - name: Build preview APKs
        run: ./gradlew assembleStandardPreview

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: ui-shell-arm64-unsigned
          path: app/build/outputs/apk/standard/preview/app-standard-arm64-v8a-preview-unsigned.apk
          if-no-files-found: error
