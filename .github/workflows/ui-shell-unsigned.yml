name: UI Shell Unsigned Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build preview APKs
        run: ./gradlew --no-configuration-cache assembleStandardPreview

      - name: Upload unsigned APK to Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ui-shell-neoplayer-iso-v1.4.4-smartstart
        run: |
          set -e
          APK=app/build/outputs/apk/standard/preview/app-standard-arm64-v8a-preview-unsigned.apk
          test -f "$APK"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --prerelease --title "XNPlayer v1.4.4 smart start unsigned" --notes "XNPlayer v1.4.4: parse start/end from mpv.conf dynamically (SS / MM:SS / HH:MM:SS, negative end = relative to end); before each loadfile, set mpv start to saved position when it lies within the main content, otherwise start after intro; re-apply configured start for files without a saved position so episodes do not leak positions. Includes v1.4.1 autoscroll/recent-playlist fixes and v1.4.0 native HW+ configure retry."
          gh release upload "$TAG" "$APK" --clobber
